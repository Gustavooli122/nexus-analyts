    :root{color-scheme:light}html.dark{color-scheme:dark}body{font-family:Inter,system-ui,sans-serif} .scrollbar::-webkit-scrollbar{width:6px;height:6px}.scrollbar::-webkit-scrollbar-thumb{background:#c7c9d7;border-radius:20px}.dark .scrollbar::-webkit-scrollbar-thumb{background:#475569}

    .field{width:100%;border:1px solid #e2e8f0;border-radius:11px;background:#fff;padding:10px 13px;outline:none;transition:box-shadow .2s,border-color .2s;font-size:13px}.field:focus{border-color:#818cf8;box-shadow:0 0 0 3px #818cf822}.dark .field{background:#111827;border-color:#35415a;color:#f1f5f9} .dark .field::placeholder{color:#748199}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:600;transition:.2s;white-space:nowrap}.btn:focus-visible,.nav-link:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}.btn-primary{background:#4f46e5;color:white}.btn-primary:hover{background:#4338ca}.btn-soft{background:#f1f4fa;color:#3f4b60}.btn-soft:hover{background:#e6ebf4}.dark .btn-soft{background:#28334a;color:#e2e8f0}.dark .btn-soft:hover{background:#35425e}

    .nav-link{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;color:#67748b;font-weight:600;font-size:13px;width:100%;transition:background .15s,color .15s}.nav-link:hover{background:#f2f4fc;color:#4f46e5}.nav-link.active{background:#eef2ff;color:#4f46e5}.dark .nav-link{color:#9ba9c0}.dark .nav-link:hover,.dark .nav-link.active{color:#c7d2fe;background:#26304a}

    .muted{color:#8893a7}.dark .muted{color:#91a0b8}.heading{color:#17243b}.dark .heading{color:#f1f5f9}.table-head{background:#f8f9fc;color:#8a96a9;text-transform:uppercase;letter-spacing:.065em;font-size:10px;font-weight:700}.dark .table-head{background:#1d273b}.data-table{width:100%;border-collapse:collapse;text-align:left}.data-table th{padding:14px 18px;white-space:nowrap}.data-table td{padding:15px 18px;border-top:1px solid #f0f1f5;font-size:12px;white-space:nowrap}.dark .data-table td{border-color:#2a354b} .data-table tbody tr:hover{background:#f9faff}.dark .data-table tbody tr:hover{background:#1b273b}

    .pill{font-size:11px;font-weight:700;border-radius:7px;padding:5px 9px;display:inline-flex;align-items:center;gap:5px}.pill::before{content:'';width:6px;height:6px;border-radius:99px;background:currentColor}.status-Paid,.status-Active{color:#059669;background:#e8faf3}.status-Pending{color:#d97706;background:#fff5dd}.status-Cancelled,.status-Inactive{color:#dc4856;background:#fff0f1}.status-Processing{color:#4f46e5;background:#eef2ff}.dark .status-Paid,.dark .status-Active{background:#064e3b77;color:#6ee7b7}.dark .status-Pending{background:#78350f66;color:#fcd34d}.dark .status-Cancelled,.dark .status-Inactive{background:#7f1d1d66;color:#fca5a5}.dark .status-Processing{background:#3730a366;color:#c7d2fe}

    .page{animation:fadein .22s ease-out}@keyframes fadein{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}.chart-wrap{position:relative;height:290px;min-width:0}.tooltip-wrap{position:relative}.tooltip-wrap .tip{display:none;position:absolute;z-index:10;top:100%;right:0;margin-top:8px}.tooltip-wrap.open .tip{display:block}.loading-hidden{display:none!important}

    @media(min-width:768px) and (max-width:1023px){#sidebar{width:78px!important}#sidebar .nav-label,#sidebar .sidebar-extra,#sidebar .brand-text{display:none}#sidebar .nav-link{justify-content:center;padding:14px}#sidebar .nav-link svg{flex-shrink:0}#main-shell{margin-left:78px!important}}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  <script>

  'use strict';

  // ==========================================================================
  // Nexus Analytics demo application
  // These comments mark the main customization points for template buyers.
  // ==========================================================================

  document.addEventListener('DOMContentLoaded',()=>{

    // DOM helpers: short aliases for querySelector and querySelectorAll.
    const $=(selector,root=document)=>root.querySelector(selector);

    const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));

    // Local storage helper: keeps demo preferences and product edits in-browser.
    const local={get(key,fallback){try{const val=localStorage.getItem('nexus-'+key);return val===null?fallback:JSON.parse(val)}catch{return fallback}},set(key,value){try{localStorage.setItem('nexus-'+key,JSON.stringify(value))}catch{toast('Could not save data in this browser.','warning')}}};

    // Formatting helpers: change en-US / USD here for another locale or currency.
    const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);

    const number=v=>new Intl.NumberFormat('en-US').format(v);

    const shortDate=v=>new Date(v+'T12:00:00').toLocaleDateString('en-US');

    const dateISO=days=>{const d=new Date();d.setDate(d.getDate()-days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};

    const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    // Demo data: replace these products, customers, and orders with your own data/API.
    const seedProducts=[{id:1,name:'Growth Plan',category:'Subscriptions',price:249,stock:999,sales:482,icon:'trending-up',color:'#6366f1'},{id:2,name:'Premium UI Kit',category:'Templates',price:189,stock:86,sales:360,icon:'palette',color:'#a855f7'},{id:3,name:'Dashboard Pro',category:'Templates',price:299,stock:58,sales:294,icon:'layout-dashboard',color:'#0ea5e9'},{id:4,name:'Starter Plan',category:'Subscriptions',price:79,stock:999,sales:277,icon:'zap',color:'#f59e0b'},{id:5,name:'Icon Pack',category:'Resources',price:59,stock:320,sales:216,icon:'shapes',color:'#10b981'},{id:6,name:'Reports Plus',category:'Services',price:149,stock:999,sales:185,icon:'file-chart-column',color:'#f43f5e'},{id:7,name:'Landing Page Kit',category:'Templates',price:129,stock:74,sales:168,icon:'panels-top-left',color:'#8b5cf6'},{id:8,name:'UX Consulting',category:'Services',price:499,stock:24,sales:82,icon:'lightbulb',color:'#f97316'}];

    const names=['Mariana Costa','Lucas Oliveira','Beatriz Santos','Rafael Almeida','Camila Ferreira','Pedro Henrique','Juliana Lima','André Rodrigues','Fernanda Ribeiro','Thiago Martins','Larissa Gomes','Bruno Carvalho','Isabela Souza','Diego Pereira','Renata Barbosa','Felipe Mendes','Amanda Rocha','Gustavo Nunes','Carolina Dias','Vitor Araújo','Natália Monteiro','Daniel Castro','Patrícia Lopes','Eduardo Moreira'];

    const customers=names.map((name,i)=>({id:i+1,name,email:name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(' ','.')+'@example.com',orders:3+(i*7)%28,total:590+(i*613)%12500,since:dateISO(13+i*11),status:i%9===0?'Inactive':'Active'}));

    const initialOrders=Array.from({length:94},(_,i)=>{const p=seedProducts[(i*7+Math.floor(i/4))%seedProducts.length],c=customers[(i*11+3)%customers.length];return{id:10542-i,customer:c.name,customerId:c.id,product:p.name,productId:p.id,date:dateISO(i*4%360),value:p.price*(1+i%3),status:['Paid','Paid','Paid','Processing','Pending','Paid','Cancelled'][i%7]}});

    // Central application state for navigation, filters, preferences, and charts.
    const state={page:'dashboard',period:'30',analyticsPeriod:'30',ordersSearch:'',ordersStatus:'All',ordersSort:'newest',ordersPage:1,ordersPageSize:10,customersSearch:'',productsSearch:'',products:local.get('products',seedProducts),profile:local.get('profile',{name:'Gabriel Alves',email:'gabriel@exemplo.com',company:'Nexus Analytics',timezone:'America/Sao_Paulo'}),prefs:local.get('prefs',{compact:false,notifications:true}),notificationsRead:local.get('notifications-read',false),orders:initialOrders,charts:{}};

    const icons=()=>{if(window.lucide)lucide.createIcons()};

    const content=$('#content');

    // Page titles/subtitles shown in each view header.
    const pageTitles={dashboard:['Overview','Track your business performance in real time.'],analytics:['Analytics','Explore your business metrics and trends.'],orders:['Orders','Manage and track your store sales.'],products:['Products','Manage your product and service catalog.'],customers:['Customers','View and manage your customer base.'],reports:['Reports','Export results and track your key metrics.'],settings:['Settings','Customize your experience and profile information.']};

    // Reusable UI helpers: toasts, popovers, sidebar state, and navigation.
    function toast(message,type='success'){const node=document.createElement('div');node.className='panel !rounded-xl shadow-xl px-4 py-3 flex items-center gap-3 min-w-[270px] max-w-sm text-sm';node.innerHTML=`<span class="${type==='success'?'text-emerald-500':type==='warning'?'text-amber-500':'text-rose-500'}"><i data-lucide="${type==='success'?'check-circle-2':type==='warning'?'alert-triangle':'circle-x'}" class="w-5 h-5"></i></span><span class="flex-1">${escapeHTML(message)}</span><button aria-label="Close" class="toast-close"><i data-lucide="x" class="w-4 h-4"></i></button>`;$('#toast-root').append(node);$('.toast-close',node).onclick=()=>node.remove();icons();setTimeout(()=>node.remove(),4200)}

    function closePopovers(){$$('.tooltip-wrap').forEach(el=>{el.classList.remove('open');$('button[aria-expanded]',el)?.setAttribute('aria-expanded','false')})}

    function togglePopover(id){const el=$('#'+id),was=el.classList.contains('open');closePopovers();el.classList.toggle('open',!was);$('button[aria-expanded]',el)?.setAttribute('aria-expanded',String(!was))}

    function mobileSidebar(open){$('#sidebar').classList.toggle('mobile-open',open);$('#mobile-backdrop').classList.toggle('hidden',!open);$('#open-sidebar').setAttribute('aria-expanded',String(open))}

    function chartDestroy(){Object.values(state.charts).forEach(chart=>chart.destroy());state.charts={}}

    function navigate(page){if(!pageTitles[page])return;chartDestroy();state.page=page;$$('.nav-link').forEach(btn=>{const active=btn.dataset.page===page;btn.classList.toggle('active',active);active?btn.setAttribute('aria-current','page'):btn.removeAttribute('aria-current')});closePopovers();mobileSidebar(false);content.innerHTML=renderPage();icons();initPageCharts();content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}

    function pageHeader(actions=''){const [title,subtitle]=pageTitles[state.page];return `<div class="flex flex-wrap gap-4 items-start justify-between mb-7"><div><p class="text-xs muted mb-2">Workspace <span class="mx-1.5">/</span> <span class="text-indigo-600 font-semibold">${title}</span></p><h1 class="text-[25px] sm:text-[29px] tracking-tight font-extrabold heading">${title}</h1><p class="text-sm muted mt-1.5">${subtitle}</p></div>${actions}</div>`}

    // Shared dashboard widgets: period selector, KPI metrics, cards, and empty states.
    const periodSelect=(id,value)=>`<label class="inline-flex items-center gap-2 text-xs font-semibold muted">Period <select id="${id}" aria-label="Select period" class="field !w-auto !py-2.5 font-semibold text-slate-700 dark:text-slate-200">${[['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days'],['365','Last 12 months']].map(([v,t])=>`<option value="${v}" ${value===v?'selected':''}>${t}</option>`).join('')}</select></label>`;

    function periodFactor(period){return {'7':.25,'30':1,'90':2.68,'365':10.4}[period]||1}

    function metrics(period){const f=periodFactor(period);return [{title:'Total revenue',value:money(128450*f),change:12.8,icon:'wallet',tone:'indigo',compare:'vs. previous period'},{title:'Total orders',value:number(Math.round(1842*f)),change:8.2,icon:'shopping-cart',tone:'violet',compare:'vs. previous period'},{title:'New customers',value:number(Math.round(324*f)),change:16.4,icon:'user-plus',tone:'sky',compare:'vs. previous period'},{title:'Conversion rate',value:(3.24+(period==='7'?.18:period==='90'?-.14:period==='365'?-.28:0)).toFixed(2)+'%',change:-2.1,icon:'target',tone:'amber',compare:'vs. previous period'}]}

    const metricCards=period=>`<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 sm:gap-5">${metrics(period).map(m=>`<article class="panel p-5 sm:p-6"><div class="flex items-center justify-between"><span class="text-[13px] font-medium muted">${m.title}</span><span class="w-10 h-10 rounded-xl bg-${m.tone}-50 dark:bg-${m.tone}-900/30 text-${m.tone}-600 dark:text-${m.tone}-300 flex items-center justify-center"><i data-lucide="${m.icon}" class="w-5 h-5"></i></span></div><div class="text-[25px] 2xl:text-[29px] font-extrabold heading mt-3 tracking-tight">${m.value}</div><div class="flex flex-wrap items-center gap-2 text-[11px] mt-2"><span class="font-bold flex items-center gap-1 ${m.change>=0?'text-emerald-600':'text-rose-500'}"><i data-lucide="${m.change>=0?'trending-up':'trending-down'}" class="w-3.5 h-3.5"></i>${m.change>0?'+':''}${m.change.toString().replace('.',',')}%</span><span class="muted">${m.compare}</span></div></article>`).join('')}</div>`;

    const cardHead=(title,subtitle,extra='')=>`<div class="flex flex-wrap items-start justify-between gap-3 mb-5"><div><h2 class="heading font-bold text-[15px]">${title}</h2><p class="muted text-xs mt-1">${subtitle}</p></div>${extra}</div>`;

    function updateOrderResults(){const list=getFilteredOrders(),start=(state.ordersPage-1)*state.ordersPageSize;const pages=Math.max(1,Math.ceil(list.length/state.ordersPageSize));if(state.ordersPage>pages){state.ordersPage=pages;return updateOrderResults()}$('#orders-results').innerHTML=list.length?`<div class="overflow-x-auto scrollbar"><table class="data-table min-w-[800px]"><thead class="table-head"><tr><th>Order</th><th>Customer</th><th>Product</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${orderRows(list.slice(start,start+state.ordersPageSize))}</tbody></table></div>`:empty('Try a different search or filter.') ;$('#orders-results').innerHTML+=`<div class="p-4 sm:p-5 flex flex-wrap justify-between items-center gap-3 border-t border-slate-100 dark:border-slate-800"><span class="text-xs muted">${list.length?`Showing ${start+1}–${Math.min(start+state.ordersPageSize,list.length)} of ${list.length}`:'0 orders'}</span><div class="flex items-center gap-2"><button class="btn btn-soft !py-2" data-action="orders-prev" ${state.ordersPage<=1?'disabled':''} aria-label="Previous page">←</button><span class="text-xs font-bold px-2">${state.ordersPage} / ${pages}</span><button class="btn btn-soft !py-2" data-action="orders-next" ${state.ordersPage>=pages?'disabled':''} aria-label="Next page">→</button></div></div>`;icons()}

    // Settings page: profile, notifications, compact view, and appearance.
    function settings(){const p=state.profile,s=state.prefs;return pageHeader()+`<form id="settings-form" class="grid grid-cols-1 xl:grid-cols-[1.4fr_1fr] gap-5"><div class="space-y-5"><section class="panel p-5 sm:p-6">${cardHead('Profile information','Customize the information displayed in the dashboard')}<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><label class="text-xs font-semibold heading">Full name<input name="name" maxlength="70" required class="field mt-2" value="${escapeHTML(p.name)}"></label><label class="text-xs font-semibold heading">Email<input name="email" type="email" maxlength="100" required class="field mt-2" value="${escapeHTML(p.email)}"></label><label class="text-xs font-semibold heading">Company<input name="company" maxlength="80" required class="field mt-2" value="${escapeHTML(p.company)}"></label><label class="text-xs font-semibold heading">Time zone<select name="timezone" class="field mt-2">${['America/Sao_Paulo','America/Campo_Grande','America/Manaus','America/Rio_Branco','UTC'].map(z=>`<option value="${z}" ${p.timezone===z?'selected':''}>${z}</option>`).join('')}</select></label></div></section><section class="panel p-5 sm:p-6">${cardHead('General settings','Preferences saved in this browser')}<label class="flex items-center justify-between gap-3 py-3 cursor-pointer"><span><span class="block heading text-xs font-semibold">Notifications</span><span class="block muted text-xs mt-1">Show demo notifications</span></span><input type="checkbox" name="notifications" ${s.notifications?'checked':''} class="w-4 h-4 accent-indigo-600"></label><div class="border-t border-slate-100 dark:border-slate-700"></div><label class="flex items-center justify-between gap-3 py-3 cursor-pointer"><span><span class="block heading text-xs font-semibold">Compact view</span><span class="block muted text-xs mt-1">Reduce overall table spacing</span></span><input type="checkbox" name="compact" ${s.compact?'checked':''} class="w-4 h-4 accent-indigo-600"></label></section><button type="submit" class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i>Save changes</button></div><section class="panel p-5 sm:p-6 self-start">${cardHead('Appearance','Choose how your dashboard looks')}<div class="grid grid-cols-2 gap-3"><button type="button" data-action="set-light" class="theme-choice rounded-xl border-2 ${!document.documentElement.classList.contains('dark')?'border-indigo-500':'border-slate-200 dark:border-slate-700'} p-3 text-left"><div class="h-20 bg-[#f2f4fa] rounded-lg p-2"><div class="h-3 w-1/2 bg-white rounded mb-2"></div><div class="h-8 bg-white rounded"></div></div><span class="flex items-center gap-2 text-xs font-semibold mt-3"><i data-lucide="sun" class="w-4 h-4"></i>Light</span></button><button type="button" data-action="set-dark" class="theme-choice rounded-xl border-2 ${document.documentElement.classList.contains('dark')?'border-indigo-500':'border-slate-200 dark:border-slate-700'} p-3 text-left"><div class="h-20 bg-[#0c1322] rounded-lg p-2"><div class="h-3 w-1/2 bg-[#26334a] rounded mb-2"></div><div class="h-8 bg-[#26334a] rounded"></div></div><span class="flex items-center gap-2 text-xs font-semibold mt-3"><i data-lucide="moon" class="w-4 h-4"></i>Dark</span></button></div><p class="muted text-xs mt-5 leading-5">Theme and settings are saved locally. No data is sent to a server.</p></section></form>`}

    function renderPage(){return({dashboard,analytics,orders,products,customers:customersPage,reports,settings})[state.page]()}

    // Chart.js helpers: chart theme, shared config, datasets, and initialization.
    function chartTheme(){return{grid:document.documentElement.classList.contains('dark')?'#334155':'#eff1f7',text:document.documentElement.classList.contains('dark')?'#9cabc3':'#98a2b3'}}

    function chartConfig(type,labels,datasets,extra={}){const theme=chartTheme();return{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:!!extra.legend,position:'bottom',labels:{color:theme.text,usePointStyle:true,pointStyle:'circle',boxWidth:8,padding:18,font:{family:'Inter',size:11}}},tooltip:{backgroundColor:'#17243b',titleFont:{family:'Inter'},bodyFont:{family:'Inter'},padding:12,cornerRadius:10,callbacks:extra.currency?{label:ctx=>`${ctx.dataset.label||'Revenue'}: ${money(ctx.parsed.y??ctx.parsed)}`}:{}}},scales:type==='doughnut'?{}:{x:{grid:{display:false},ticks:{color:theme.text,maxRotation:0,autoSkip:true,font:{size:10}}},y:{beginAtZero:true,grid:{color:theme.grid},border:{display:false},ticks:{color:theme.text,font:{size:10},callback:extra.currency?v=>v>=1000?'$'+Math.round(v/1000)+'k':v:undefined}}},cutout:type==='doughnut'?'68%':undefined}}}

    function makeChart(id,config){const el=$('#'+id);if(el&&window.Chart){state.charts[id]=new Chart(el,config)}}

    function timeline(period){const count=period==='7'?7:period==='30'?10:period==='90'?12:12;const labels=Array.from({length:count},(_,i)=>period==='365'?['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'][i]:period==='7'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]:`Day ${i+1}`);const f=period==='365'?1.6:period==='90'?1.2:period==='7'?.34:1;return{labels,revenue:labels.map((_,i)=>Math.round((6700+i*460+Math.sin(i*1.8)*1500+(i%3)*480)*f)),orders:labels.map((_,i)=>Math.round((55+i*7+Math.sin(i*1.9)*14)*(period==='365'?3:period==='7'?.5:1)))}}

    function initPageCharts(){if(!window.Chart){setTimeout(initPageCharts,150);return}const period=state.page==='analytics'?state.analyticsPeriod:state.period,t=timeline(period),blue='#6366f1',violet='#a78bfa';const gradient=id=>{const canvas=$('#'+id);if(!canvas)return blue;const grad=canvas.getContext('2d').createLinearGradient(0,0,0,300);grad.addColorStop(0,'rgba(99,102,241,.24)');grad.addColorStop(1,'rgba(99,102,241,0)');return grad};const line=(id,values,labels=t.labels)=>makeChart(id,chartConfig('line',labels,[{label:'Revenue',data:values,borderColor:blue,backgroundColor:gradient(id),fill:true,tension:.42,pointRadius:2,pointHoverRadius:5,borderWidth:2.5}],{currency:true}));const bars=(id,values,labels=t.labels)=>makeChart(id,chartConfig('bar',labels,[{label:'Orders',data:values,backgroundColor:labels.map((_,i)=>i===labels.length-2?blue:violet),borderRadius:6,barPercentage:.62}],{}));const doughnut=(id,labels,values)=>makeChart(id,chartConfig('doughnut',labels,[{label:'Share',data:values,backgroundColor:['#6366f1','#a78bfa','#38bdf8','#34d399','#fbbf24'],borderWidth:0,hoverOffset:7}],{legend:true}));if(state.page==='dashboard'){line('revenue-chart',t.revenue);bars('sales-chart',t.orders);doughnut('category-chart',['Subscriptions','Templates','Services','Resources'],[42,35,15,8])}if(state.page==='analytics'){line('analytics-revenue',t.revenue);bars('analytics-orders',t.orders);doughnut('traffic-chart',['Organic Search','Direct','Social Media','Referral','Other'],[38,26,19,12,5])}if(state.page==='reports'){const r=timeline('365');line('report-chart',r.revenue,r.labels);doughnut('report-category',['Subscriptions','Templates','Services','Resources'],[42,35,15,8])}if(state.page==='orders')updateOrderResults();if(state.page==='products')updateProductResults();if(state.page==='customers')updateCustomerResults()}

    function setTheme(dark){document.documentElement.classList.toggle('dark',dark);local.set('theme',dark?'dark':'light');if(state.page==='settings'){navigate('settings')}else if(['dashboard','analytics','reports'].includes(state.page)){chartDestroy();initPageCharts()}icons()}

    // Product CRUD modal: add/edit demo products stored in localStorage.
    function productModal(id=null){const product=state.products.find(p=>p.id===id),edit=!!product;$('#modal-root').innerHTML=`<div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-[2px] flex items-center justify-center p-4"><div role="dialog" aria-modal="true" aria-labelledby="modal-title" class="panel w-full max-w-lg max-h-[92vh] overflow-y-auto scrollbar p-5 sm:p-7 shadow-2xl"><div class="flex justify-between items-center mb-5"><h2 id="modal-title" class="heading font-bold text-xl">${edit?'Edit':'Add'} product</h2><button type="button" data-action="close-modal" aria-label="Close modal" class="btn btn-soft !p-2"><i data-lucide="x" class="w-4 h-4"></i></button></div><form id="product-form" data-id="${edit?product.id:''}" class="space-y-4"><label class="block text-xs heading font-semibold">Product name<input name="name" required maxlength="80" class="field mt-2" placeholder="e.g. Premium Template" value="${escapeHTML(product?.name||'')}"></label><label class="block text-xs heading font-semibold">Category<select name="category" class="field mt-2">${['Subscriptions','Templates','Services','Resources','Other'].map(c=>`<option ${product?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><div class="grid grid-cols-2 gap-4"><label class="text-xs heading font-semibold">Price (USD)<input name="price" required min="0" max="999999" step="0.01" type="number" class="field mt-2" value="${product?.price??''}" placeholder="0.00"></label><label class="text-xs heading font-semibold">Stock<input name="stock" required min="0" max="999999" step="1" type="number" class="field mt-2" value="${product?.stock??0}"></label></div><div class="flex justify-end gap-3 pt-4"><button type="button" data-action="close-modal" class="btn btn-soft">Cancel</button><button type="submit" class="btn btn-primary">${edit?'Save product':'Add product'}</button></div></form></div></div>`;icons();$('#product-form input[name=name]').focus()}

    function confirmDelete(id){const product=state.products.find(p=>p.id===id);if(!product)return;$('#modal-root').innerHTML=`<div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4"><div role="alertdialog" aria-modal="true" aria-labelledby="delete-title" class="panel p-7 max-w-sm w-full shadow-2xl"><div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center mb-4"><i data-lucide="trash-2" class="w-6 h-6"></i></div><h2 id="delete-title" class="heading font-bold text-lg">Delete product?</h2><p class="muted text-sm mt-2">“${escapeHTML(product.name)}” will be removed from the local catalog. You can restore it by resetting the demo data.</p><div class="flex justify-end gap-2 mt-6"><button data-action="close-modal" class="btn btn-soft">Cancel</button><button data-action="confirm-delete" data-id="${id}" class="btn bg-rose-600 hover:bg-rose-700 text-white">Delete</button></div></div></div>`;icons();$('[data-action="close-modal"]','#modal-root').focus()}

    function closeModal(){$('#modal-root').innerHTML=''}

    // CSV export: generated entirely on the client, without a backend.
    function exportCSV(kind='report'){const sep=';',quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let rows=[];if(kind==='orders'){rows=[['Order','Customer','Product','Date','Amount (USD)','Status'],...getFilteredOrders().map(o=>[o.id,o.customer,o.product,o.date,o.value.toFixed(2),o.status])]}else{rows=[['NEXUS ANALYTICS - DEMO'],['FICTIONAL DATA - DO NOT USE AS A REAL REPORT'],[],['Metric','Value'],...metrics('30').map(m=>[m.title,m.value]),[],['ORDERS'],['Order','Customer','Product','Date','Amount (USD)','Status'],...state.orders.map(o=>[o.id,o.customer,o.product,o.date,o.value.toFixed(2),o.status]),[],['PRODUCTS'],['Name','Category','Price (USD)','Stock','Sales'],...state.products.map(p=>[p.name,p.category,p.price.toFixed(2),p.stock,p.sales])]};const csv='\ufeff'+rows.map(row=>row.map(quote).join(sep)).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download=`nexus-${kind==='orders'?'orders':'report'}-demo.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Demo CSV exported successfully.')}

    function updateNotifications(){const list=$('#notifications-list');list.innerHTML=state.prefs.notifications?activities().slice(0,3).map(a=>`<div class="flex gap-2.5"><span class="w-2 h-2 bg-indigo-500 rounded-full mt-1.5 ${state.notificationsRead?'opacity-0':''}"></span><div><p class="heading font-semibold text-xs">${a.title}</p><p class="muted text-[11px] mt-1">${a.desc} · ${a.time}</p></div></div>`).join(''):'<p class="muted text-xs">Notifications are disabled.</p>';$('#notification-dot').classList.toggle('hidden',state.notificationsRead||!state.prefs.notifications)}

    // Global delegated click handler for dynamically rendered action buttons.
    document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){const action=btn.dataset.action,id=Number(btn.dataset.id);switch(action){case'export':exportCSV();break;case'export-orders':exportCSV('orders');break;case'go-orders':navigate('orders');break;case'goto-settings':case'profile-settings':navigate('settings');break;case'demo-logout':toast('This is a demo environment with no authentication.','warning');break;case'new-product':productModal();break;case'edit-product':productModal(id);break;case'delete-product':confirmDelete(id);break;case'close-modal':closeModal();break;case'confirm-delete':state.products=state.products.filter(p=>p.id!==id);local.set('products',state.products);closeModal();updateProductResults();toast('Product deleted from the local catalog.');break;case'orders-prev':state.ordersPage=Math.max(1,state.ordersPage-1);updateOrderResults();break;case'orders-next':state.ordersPage++;updateOrderResults();break;case'set-light':setTheme(false);toast('Light theme enabled.');break;case'set-dark':setTheme(true);toast('Dark theme enabled.');break;}return}if(e.target.id==='modal-backdrop')closeModal();if(!e.target.closest('.tooltip-wrap'))closePopovers()});

    // Form submission handler for products and settings.
    document.addEventListener('submit',e=>{if(e.target.id==='product-form'){e.preventDefault();const f=new FormData(e.target),id=Number(e.target.dataset.id),name=String(f.get('name')).trim(),price=Number(f.get('price')),stock=Number(f.get('stock'));if(!name||!Number.isFinite(price)||price<0||!Number.isSafeInteger(stock)||stock<0){toast('Please check the product information.','error');return}if(id){const p=state.products.find(p=>p.id===id);if(!p)return;Object.assign(p,{name,category:String(f.get('category')),price,stock})}else{state.products.unshift({id:Math.max(0,...state.products.map(p=>p.id))+1,name,category:String(f.get('category')),price,stock,sales:0,icon:'package',color:'#6366f1'})}local.set('products',state.products);closeModal();navigate('products');toast(id?'Product updated successfully.':'Product added successfully.')}if(e.target.id==='settings-form'){e.preventDefault();const f=new FormData(e.target);state.profile={name:String(f.get('name')).trim(),email:String(f.get('email')).trim(),company:String(f.get('company')).trim(),timezone:String(f.get('timezone'))};state.prefs={notifications:f.has('notifications'),compact:f.has('compact')};local.set('profile',state.profile);local.set('prefs',state.prefs);$('#header-name').textContent=state.profile.name;document.body.classList.toggle('compact',state.prefs.compact);updateNotifications();toast('Settings saved in this browser.')}});

    // Live search handlers for orders, products, and customers.
    document.addEventListener('input',e=>{if(e.target.id==='orders-search'){state.ordersSearch=e.target.value;state.ordersPage=1;updateOrderResults()}if(e.target.id==='products-search'){state.productsSearch=e.target.value;updateProductResults()}if(e.target.id==='customers-search'){state.customersSearch=e.target.value;updateCustomerResults()}});

    // Select/change handlers for periods, filters, and sorting.
    document.addEventListener('change',e=>{if(e.target.id==='dashboard-period'){state.period=e.target.value;navigate('dashboard')}if(e.target.id==='analytics-period'){state.analyticsPeriod=e.target.value;navigate('analytics')}if(e.target.id==='orders-status'){state.ordersStatus=e.target.value;state.ordersPage=1;updateOrderResults()}if(e.target.id==='orders-sort'){state.ordersSort=e.target.value;state.ordersPage=1;updateOrderResults()}});

    $$('.nav-link').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));

    $('#theme-toggle').onclick=()=>setTheme(!document.documentElement.classList.contains('dark'));

    $('#notifications-btn').onclick=()=>togglePopover('notifications-wrap');$('#profile-btn').onclick=()=>togglePopover('profile-wrap');$('#mark-read').onclick=()=>{state.notificationsRead=true;local.set('notifications-read',true);updateNotifications();closePopovers();toast('Notifications marked as read.')};

    $('#open-sidebar').onclick=()=>mobileSidebar(true);$('#close-sidebar').onclick=()=>mobileSidebar(false);$('#mobile-backdrop').onclick=()=>mobileSidebar(false);

    // Global search: route matching first, then demo-data matching.
    function globalSearch(q){q=q.trim().toLowerCase();if(!q)return;const pages={'dashboard':'dashboard','overview':'dashboard','analytics':'analytics','order':'orders','orders':'orders','product':'products','products':'products','customer':'customers','customers':'customers','report':'reports','reports':'reports','settings':'settings'};const page=Object.entries(pages).find(([term])=>term.includes(q)||q.includes(term));if(page){navigate(page[1]);toast('Section found: '+pageTitles[page[1]][0]);return}state.ordersSearch=q;state.productsSearch=q;state.customersSearch=q;const matches=state.orders.some(o=>(o.customer+' '+o.product).toLowerCase().includes(q));if(matches){navigate('orders');return}if(state.products.some(p=>p.name.toLowerCase().includes(q))){navigate('products');return}if(customers.some(c=>c.name.toLowerCase().includes(q))){navigate('customers');return}toast('No items found for that search.','warning')}

    $('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){globalSearch(e.target.value);e.target.blur()}});$('#mobile-search-btn').onclick=()=>{const q=prompt('Search the dashboard (sections, orders, products, and customers):');if(q!==null)globalSearch(q)};

    // Keyboard shortcuts: Esc closes overlays; Ctrl/Cmd + K focuses search.
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePopovers();mobileSidebar(false)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search').focus()}});

    // Initial app boot: year, profile name, compact mode, notifications, and dashboard.
    $('#year').textContent=new Date().getFullYear();$('#header-name').textContent=state.profile.name;document.body.classList.toggle('compact',state.prefs.compact);const extraStyle=document.createElement('style');extraStyle.textContent='.compact .data-table td{padding-top:9px;padding-bottom:9px}';document.head.appendChild(extraStyle);updateNotifications();navigate('dashboard');

  });

  </script>

</body>

</html>
